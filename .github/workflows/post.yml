name: post-short
on:
  schedule:
    - cron: "17 9 * * *"    # ~11:17 CEST
    - cron: "17 17 * * *"   # ~19:17 CEST
  workflow_dispatch:
permissions:
  contents: write
jobs:
  post:
    runs-on: self-hosted    # your Mac (YouTube blocks GitHub's servers)
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install -q --upgrade -r requirements.txt --break-system-packages || python3 -m pip install -q --upgrade -r requirements.txt
      - run: python3 pipeline.py
        env:
          GH_TOKEN: ${{ github.token }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
      - name: Commit log
        run: |
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add posted_log.csv && git commit -m "log" && git push || true
