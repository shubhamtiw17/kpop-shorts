name: post-short
on:
  schedule:
    - cron: "17 3-18 * * *"   # hourly 08:47–23:47 IST; runs in GitHub's cloud, Mac can be off
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: post-short
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q -r requirements.txt
      - run: python pipeline.py publish
        env:
          GH_TOKEN: ${{ github.token }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
      - name: Commit log
        if: always()
        run: |
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add posted_log.csv && git commit -m "log" && git pull --rebase && git push || true
